<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ga Youn Choi - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:ital,wght@1,400&display=swap" rel="stylesheet">
    <style>
        * { cursor: none !important; }

        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Custom cursor — mix-blend-mode: difference inverts color automatically */
        #custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 20px; height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            mix-blend-mode: difference; /* Magic: inverts based on background */
            transition: width 0.25s ease, height 0.25s ease;
        }

        #main-title {
            font-size: 2.5vw;
            font-weight: 400;
            letter-spacing: -0.05em; /* Tighter letter spacing */
            margin: 0;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        sup {
            font-family: 'Noto Serif Tamil', serif; 
            font-style: italic; 
            font-size: 0.7em; 
            margin-left: 6px; 
            font-weight: 400; 
            letter-spacing: 0;
        }

        /* Blinking cursor */
        #cursor-bar {
            display: inline-block;
            width: 1.5px;
            height: 0.65em;
            background-color: #ffffff;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* Slide up transition block */
        #transition-block {
            position: fixed;
            bottom: -100vh;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #FCFCFC;
            z-index: 20;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        @media (max-width: 600px) {
            #main-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <h1 id="main-title">
        Choi Ga Youn<sup><span id="typing-text"></span><span id="cursor-bar"></span></sup>
    </h1>
    
    <div id="transition-block"></div>
    <div id="custom-cursor"></div>

    <script>
        // Smooth lagging cursor tracking
        const cursor = document.getElementById('custom-cursor');
        let mouseX = 0, mouseY = 0, curX = 0, curY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        (function animateCursor() {
            curX += (mouseX - curX) * 0.15;
            curY += (mouseY - curY) * 0.15;
            cursor.style.left = curX + 'px';
            cursor.style.top  = curY + 'px';
            requestAnimationFrame(animateCursor);
        })();
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const typingElement = document.getElementById('typing-text');
            const cursorBar    = document.getElementById('cursor-bar');
            const targetText   = "1) 2) 3)";
            let index = 0;

            // Start typing after 500ms: cursor blinks first, then each char types
            setTimeout(() => {
                const typingInterval = setInterval(() => {
                    typingElement.textContent += targetText[index];
                    index++;

                    if (index === targetText.length) {
                        clearInterval(typingInterval);

                        // Keep cursor blinking a beat longer, then hide it
                        setTimeout(() => {
                            cursorBar.style.display = 'none';
                        }, 800);

                        // 1 second after typing finishes, slide-up transition
                        setTimeout(() => {
                            const block = document.getElementById('transition-block');
                            block.style.transform = 'translateY(-100vh)';

                            // Navigate once slide finishes
                            setTimeout(() => {
                                window.location.href = 'project.html';
                            }, 1000);
                        }, 1000);
                    }
                }, 180); // Slightly slower for rhythm
            }, 600); // Wait before typing starts — cursor blinks alone first
        });
    </script>
</body>
</html>
